name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-apply
  cancel-in-progress: false

env:
  TF_VERSION: "1.15.6"
  AWS_REGION: us-east-1

jobs:
  apply:
    name: Apply infrastructure
    runs-on: ubuntu-latest
    # EKS takes 10 to 15 minutes for the control plane and as long again for
    # the node group. The waiting steps below have their own limits.
    timeout-minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Verify credentials
        run: |
          aws ec2 describe-vpcs --max-items 1 > /dev/null 2>&1 || {
            echo "::error::AWS credentials missing, expired or revoked. Learner Lab credentials drop when the lab session stops; run Start Lab, then ./scripts/refresh-aws-secrets.sh"
            exit 1
          }

      - name: terraform init
        run: terraform init -input=false

      - name: terraform apply
        run: terraform apply -auto-approve -input=false -no-color

      # A green apply with the cluster in an invalid state is a false positive:
      # apply answers "created", not "working".
      - name: Cluster is active
        run: |
          status=$(aws eks describe-cluster --name car-repair-shop \
                   --query 'cluster.status' --output text)
          echo "status=$status"
          [ "$status" = "ACTIVE" ] || { echo "::error::Cluster is $status"; exit 1; }

      - name: Nodes are ready
        run: |
          aws eks update-kubeconfig --name car-repair-shop --region "$AWS_REGION"
          kubectl wait --for=condition=Ready nodes --all --timeout=600s
          kubectl get nodes

      # Observability is part of what this environment delivers: if it does not
      # come up, the deploy must not pass as green.
      - name: Observability responding
        run: |
          kubectl wait --for=condition=Ready pods --all \
            -n observability --timeout=600s
          kubectl get pods -n observability

      - name: Summary
        run: |
          {
            echo "### Cluster applied"
            echo ""
            echo '| Item | Value |'
            echo '|---|---|'
            echo "| Kubernetes version | $(aws eks describe-cluster --name car-repair-shop --query 'cluster.version' --output text) |"
            echo "| Nodes ready | $(kubectl get nodes --no-headers | grep -c ' Ready ') |"
            echo "| Observability pods | $(kubectl get pods -n observability --no-headers | wc -l) |"
            echo ""
            echo "Approximate cost while up: **USD 4.97/day**."
            echo "To tear down: the **Destroy** workflow, or \`./scripts/teardown.sh\`."
          } >> "$GITHUB_STEP_SUMMARY"
