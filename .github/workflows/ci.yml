name: CI

on:
  # No target-branch filter: work arrives as stacked PRs that point at each
  # other rather than at main, and a filter would skip all of them.
  pull_request:

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.15.6"
  AWS_REGION: us-east-1

jobs:
  # The real gate: it needs no AWS credential, so it still holds when the
  # Learner Lab's temporary key expires or is revoked.
  validate:
    name: Format, syntax and security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform init
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

      # trivy does not cover open ingress: verified that it reports nothing for
      # ingress 0.0.0.0/0 while flagging the equivalent egress.
      - name: No ingress open to the internet
        run: python3 scripts/check-no-public-ingress.py

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tflint --init
          tflint --format compact

      - name: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  plan:
    name: Change plan
    needs: validate
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Verify credentials antes de tentar
        id: creds
        run: |
          if aws ec2 describe-vpcs --max-items 1 > /dev/null 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::AWS credentials missing, expired or revoked. Learner Lab credentials drop when the lab session stops; run ./scripts/refresh-aws-secrets.sh after Start Lab."
          fi

      - name: terraform init
        if: steps.creds.outputs.ok == 'true'
        run: terraform init -input=false

      - name: terraform plan
        id: plan
        if: steps.creds.outputs.ok == 'true'
        run: |
          # TEXT output, never `terraform show -json`: the JSON carries
          # sensitive values in clear text and this repository is public.
          terraform plan -input=false -no-color -lock=false > plan.txt 2>&1 || true
          {
            echo 'stdout<<PLANEOF'
            tail -c 60000 plan.txt
            echo 'PLANEOF'
          } >> "$GITHUB_OUTPUT"

      - name: Comment the plan on the PR
        if: steps.creds.outputs.ok == 'true'
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const marker = '<!-- terraform-plan -->';
            const body = `${marker}
            ### Terraform plan

            <details><summary>See what will change</summary>

            \`\`\`hcl
            ${process.env.PLAN}
            \`\`\`

            </details>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }
