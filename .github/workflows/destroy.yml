name: Destroy

# Manual only, with a typed confirmation. EKS is the most expensive resource
# here: the control plane costs USD 0.10/hour, about five times the database.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "production" to confirm the destruction'
        required: true
        type: string
      sweep:
        description: "Also remove what is left outside the Terraform state"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: terraform-apply
  cancel-in-progress: false

env:
  TF_VERSION: "1.15.6"
  AWS_REGION: us-east-1

jobs:
  destroy:
    name: Destroy infrastructure
    if: inputs.confirm == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Verify credentials
        run: |
          aws ec2 describe-vpcs --max-items 1 > /dev/null 2>&1 || {
            echo "::error::Credentials missing, expired or revoked."
            exit 1
          }

      - name: terraform init
        run: terraform init -input=false

      # Load balancers come from Services inside the cluster, not from the
      # Terraform state. Destroying the cluster without removing them first
      # leaves an orphaned NLB billing, and destroy stalls on the network
      # dependency.
      - name: Remove LoadBalancer Services first
        continue-on-error: true
        run: |
          aws eks update-kubeconfig --name car-repair-shop --region "$AWS_REGION" || exit 0
          kubectl delete svc --all-namespaces \
            --field-selector spec.type=LoadBalancer --ignore-not-found --timeout=300s || true
          sleep 60

      - name: terraform destroy
        run: terraform destroy -auto-approve -input=false -no-color

      - name: Sweep what is left outside the state
        if: inputs.sweep
        run: ./scripts/teardown.sh --sweep --yes

      # A green destroy does not prove a clean account: a partial EKS destroy
      # leaves the node group billing EC2.
      - name: Confirm nothing billable is left
        run: |
          leftover=0
          eks=$(aws eks list-clusters --query 'clusters[]' --output text)
          ec2=$(aws ec2 describe-instances --filters "Name=instance-state-name,Values=running" \
                --query 'Reservations[].Instances[].InstanceId' --output text)
          elb=$(aws elbv2 describe-load-balancers --query 'LoadBalancers[].LoadBalancerArn' --output text)
          [ -n "$eks" ] && { echo "::warning::Cluster still present: $eks"; leftover=1; }
          [ -n "$ec2" ] && { echo "::warning::EC2 still running: $ec2"; leftover=1; }
          [ -n "$elb" ] && { echo "::warning::Load balancer still present"; leftover=1; }
          {
            echo "### Destruction complete"
            echo ""
            if [ "$leftover" = "0" ]; then
              echo "Nothing billable left in this region."
            else
              echo "**A billable resource is left.** Run again with \`sweep\` checked."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$leftover" = "0" ]

  recusado:
    name: Invalid confirmation
    if: inputs.confirm != 'production'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Invalid confirmation. Type exactly 'production' to destroy."
          exit 1
